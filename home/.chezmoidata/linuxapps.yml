# link: https://terminaltrove.com/
linuxapps:
  essential:
    - git # preinstalled git is often outdated
    - rsync
    - tldr
    - navi
    - fzf
    - yazi
    - broot
    - carapace
    - zoxide
    - tssh
    # p2p file transfer
    - croc
    - git-filter-repo
    - tmux
    - dive
    - lazydocker
    - canonical: nodejs
      name:
        - node
        - npm
        - npx
    - canonical: less
      name:
        - less
        - lesskey
    - canonical: age
      name:
        - age
        - age-keygen
    - canonical: aria2
      name: aria2c
    # git signing key needs ssh keygen
    - canonical: openssh
      name:
        - scp
        - sftp
        - ssh
        - ssh-add
        - ssh-agent
        - ssh-keygen
        - ssh-keyscan
        - sshd
    - canonical: vim
      name:
        - ex
        - rview
        - rvim
        - view
        - vim
        - vimdiff
        - vimtutor
        - xxd
  shell:
    - shellcheck

    # original name is shfmt, additional prefix is for pixi installation
    - canonical: go-shfmt
      name: shfmt
  build:
    - canonical: cmake
      name:
        - ccmake
        - cmake
        - cpack
        - ctest
  network:
    - canonical: iperf
      name: iperf3
    - canonical: hurl
      name:
        - hurl
        - hurlfmt
    # - nmap doesn't exist
    # - bandwhich
    - rclone
    - posting
    - restic
  extra:
    - bat
    - gh
    - gh-dash
    - eza
    - btop
    - nvtop
    - pnpm
    - fnm
    # explore docker layer
    - dive
    - starship
    - dust # better du
    - duf # better df
    - act # github action local
    - canonical: ipython
      name:
        - ipython
        - ipython3
    - canonical: fastfetch
      name:
        - fastfetch
        - flashfetch
    - canonical: git-delta
      name: delta
    - canonical: fd-find
      name: fd
    - jq
    - canonical: yq
      name:
        - tomlq
        - yq
        - xq
    - canonical: ripgrep
      name: rg
  media:
    - ffmpeg
    - canonical: imagemagick
      name:
        - animate
        - compare
        - composite
        - conjure
        - convert
        - display
        - identify
        - import
        - magick
        - magick-script
        - Magick++-config
        - MagickCore-config
        - MagickWand-config
        - mogrify
        - montage
        - stream
    - pandoc
    # terminal recorder
    - vhs

