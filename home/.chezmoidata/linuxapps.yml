linuxapps:
  essential:
    - git # preinstalled git is often outdated
    - rsync
    - tldr
    - fzf
    - yazi
    - carapace
    - zoxide
    - tssh
    - git-filter-repo
    - tmux
    - pnpm
    - canonical: less
      name:
        - less
        - lesskey
    # git signing key needs ssh keygen
    - canonical: openssh
      name:
        - scp
        - sftp
        - ssh
        - ssh-add
        - ssh-agent
        - ssh-keygen
        - ssh-keyscan
        - sshd
    - canonical: vim
      name:
        - ex
        - rview
        - rvim
        - view
        - vim
        - vimdiff
        - vimtutor
        - xxd
  shell:
    - shellcheck

    # original name is shfmt, additional prefix is for pixi installation
    - canonical: go-shfmt
      name: shfmt
  build:
    - canonical: cmake
      name:
        - ccmake
        - cmake
        - cpack
        - ctest
  network:
    - canonical: iperf
      name: iperf3
    # - nmap doesn't exist
    - rclone
  extra:
    - bat
    - gh
    - eza
    - btop
    - starship
    - dust # view folder size
    - act # github action local
    - canonical: ipython
      name:
        - ipython
        - ipython3
    - canonical: git-delta
      name: delta
    - canonical: fd-find
      name: fd
    - jq
    - canonical: ripgrep
      name: rg
  media:
    - ffmpeg
    - canonical: imagemagick
      name:
        - animate
        - compare
        - composite
        - conjure
        - convert
        - display
        - identify
        - import
        - magick
        - magick-script
        - Magick++-config
        - MagickCore-config
        - MagickWand-config
        - mogrify
        - montage
        - stream
    - pandoc
