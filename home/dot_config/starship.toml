"$schema" = 'https://starship.rs/config-schema.json'

# Keep prompt rendering responsive while still allowing project detection.
scan_timeout = 30
command_timeout = 500
add_newline = true
follow_symlinks = true
palette = 'catppuccin_mocha'

# Project information stays on the left; runtime information is separated by
# a fill so it remains readable as the terminal width changes.
format = '''
$username$hostname$directory$git_branch$git_status$git_metrics$fill$docker_context$kubernetes$python$nodejs$golang$rust$cmd_duration$time$line_break$character'''

right_format = '$status'
continuation_prompt = '[∙](overlay0) '

# Colors are ANSI *named* colors (not fixed hex) so the prompt follows the
# terminal / VSCode theme instead of hard-coding Catppuccin Mocha values. With a
# Catppuccin terminal theme these names resolve to the matching Mocha hexes
# (blue=#89b4fa, purple=#cba6f7, etc.); with any other theme they follow it.
# `lavender` has no 16-color ANSI equivalent, so it's approximated as `blue`.
[palettes.catppuccin_mocha]
rosewater = 'bright-white'
flamingo = 'bright-red'
pink = 'bright-purple'
mauve = 'purple'
red = 'red'
maroon = 'bright-red'
peach = 'bright-yellow'
yellow = 'yellow'
green = 'green'
teal = 'cyan'
sky = 'bright-cyan'
sapphire = 'bright-blue'
blue = 'blue'
lavender = 'blue'
text = 'white'
subtext1 = 'bright-black'
overlay0 = 'bright-black'
surface0 = 'black'

[username]
show_always = false
format = '[$user]($style)@'
style_user = 'bold blue'
style_root = 'bold red'

[hostname]
ssh_only = true
format = '[$hostname]($style) '
style = 'bold yellow'
ssh_symbol = 'ssh '

[directory]
style = 'bold lavender'
read_only = ' '
read_only_style = 'red'
truncation_length = 3
truncate_to_repo = true
truncation_symbol = '…/'
repo_root_style = 'bold lavender'
repo_root_format = '[$before_root_path]($before_root_style)[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) '

[git_branch]
symbol = ' '
style = 'bold mauve'
truncation_length = 30
truncation_symbol = '…'
always_show_remote = true
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_status]
style = 'bold red'
format = '([$all_status$ahead_behind]($style) )'
conflicted = '=${count}'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇡${ahead_count}⇣${behind_count}'
untracked = '?${count}'
stashed = '*${count}'
modified = '!${count}'
staged = '+${count}'
renamed = '»${count}'
deleted = '✘${count}'

[git_metrics]
disabled = false
added_style = 'bold green'
deleted_style = 'bold red'
format = '([+$added]($added_style) [-$deleted]($deleted_style) )'

[fill]
symbol = '─'
style = 'dimmed overlay0'

[python]
symbol = ' '
style = 'yellow'
format = '[$symbol$pyenv_prefix$version( \($virtualenv\))]($style) '

[nodejs]
symbol = ' '
style = 'green'
format = '[$symbol$version]($style) '

[golang]
symbol = ' '
style = 'sky'
format = '[$symbol$version]($style) '

[rust]
symbol = ' '
style = 'peach'
format = '[$symbol$version]($style) '

[docker_context]
symbol = ' '
style = 'blue'
format = '[$symbol$context]($style) '

[kubernetes]
disabled = false
symbol = '󱃾 '
format = '[$symbol$context( / $namespace)]($style) '
style = 'bold teal'

[[kubernetes.contexts]]
context_pattern = '.*prod.*|.*production.*'
style = 'bold white bg:red'
symbol = '⚠ '

[[kubernetes.contexts]]
context_pattern = '.*staging.*|.*stage.*'
style = 'bold yellow'
symbol = '󰗆 '

[cmd_duration]
min_time = 2_000
show_milliseconds = true
show_notifications = false
format = 'took [$duration]($style) '
style = 'yellow'

[status]
disabled = false
format = '[$symbol$status]($style) '
symbol = '✘ '
style = 'bold red'
map_symbol = true
pipestatus = true

[time]
disabled = false
time_format = '%H:%M:%S'
format = '[$time]($style) '
style = 'dimmed subtext1'

[character]
success_symbol = '[❯](bold green)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold blue)'
vimcmd_visual_symbol = '[❮](bold mauve)'
vimcmd_replace_symbol = '[❮](bold red)'
vimcmd_replace_one_symbol = '[❮](bold red)'

[package]
disabled = true

[custom.disk]
description = 'Available disk space for the current directory'
command = "df -h . | awk 'END {print $4}'"
when = true
shell = ['sh']
format = '[DISK $output]($style) '
style = 'dimmed teal'

[custom.terraform_project]
description = 'Terraform project marker'
command = 'printf Terraform'
detect_extensions = ['tf']
detect_files = ['.terraform.lock.hcl']
detect_folders = ['.terraform']
format = '[$output]($style) '
style = 'bold mauve'

# Starship can also render the statusline consumed by Claude Code.
[profiles]
claude-code = '$claude_model$git_branch$claude_context$claude_cost'

[claude_model]
format = '[$symbol$model]($style) '
symbol = '󰚩 '
style = 'bold blue'

[claude_context]
format = '[$gauge $percentage]($style) '
gauge_width = 10

[claude_cost]
format = '[$symbol$cost]($style) '
symbol = '󰄛 '
