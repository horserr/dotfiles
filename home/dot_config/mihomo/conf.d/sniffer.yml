sniffer:
  enable: true
  # override-destination：用嗅探到的真实域名覆盖连接目标
  # 在 TUN 模式下必须开启，否则拿到的是 IP，域名规则无法匹配
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "Mijia Cloud" # 小米云，跳过嗅探
    - "+.push.apple.com" # 苹果推送
