rules:
  # ════ 非 IP 类规则 ════════════════════════════════════════════

  # 广告拦截（最优先）
  - RULE-SET,reject_non_ip,🛡️ AD
  - RULE-SET,reject_domainset,🛡️ AD
  - RULE-SET,reject_non_ip_drop,REJECT-DROP # 静默丢弃，防止某些探测

  - RULE-SET,google_non_ip,🕸️ GOOGLE
  - RULE-SET,download_non_ip,⬇️ DOWNLOAD

  # AI
  - RULE-SET,ai_non_ip,🤖 AI

  # 电报
  - RULE-SET,telegram_non_ip,✈️ TELEGRAM

  # 流媒体
  - RULE-SET,stream_non_ip,📹 STREAM

  # 微软（CDN 直连，服务走微软组）
  - RULE-SET,microsoft_cdn_non_ip,DIRECT
  - RULE-SET,microsoft_non_ip,Ⓜ️ MICROSOFT

  # 国外流量走代理
  - RULE-SET,global_non_ip,🎯 PROXY

  # 国内 / 直连
  - RULE-SET,domestic_non_ip,DIRECT
  - RULE-SET,direct_non_ip,DIRECT
  - RULE-SET,lan_non_ip,DIRECT

  # ════ IP 类规则（会触发 DNS 解析，务必放在域名规则后面）═════

  - RULE-SET,reject_ip,🛡️ AD
  - RULE-SET,telegram_ip,✈️ TELEGRAM
  - RULE-SET,stream_ip,📹 STREAM
  - RULE-SET,lan_ip,DIRECT
  - RULE-SET,domestic_ip,DIRECT
  - RULE-SET,china_ip,DIRECT

  # ════ 兜底 ═══════════════════════════════════════════════════
  - MATCH,🐟 MATCH
